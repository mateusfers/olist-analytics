name: Update Data

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install pandas numpy
    - name: Run data update
      run: |
        python -c "
import pandas as pd
import os

# Verificar se a pasta data/raw existe
if not os.path.exists('data/raw'):
    print('❌ Pasta data/raw não encontrada!')
    exit(1)

# Verificar se o arquivo existe
if not os.path.exists('data/raw/olist_orders_dataset.csv'):
    print('❌ Arquivo data/raw/olist_orders_dataset.csv não encontrado!')
    exit(1)

print('📊 Atualizando dados...')
df = pd.read_csv('data/raw/olist_orders_dataset.csv')

# Criar a pasta data/ se não existir
os.makedirs('data/', exist_ok=True)

df.to_csv('data/processed_data.csv', index=False)
print(f'✅ {len(df)} registros processados')
print('✅ Dados salvos em data/processed_data.csv')
"
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/processed_data.csv
        git diff --staged --quiet || git commit -m "chore: update processed data"
        git push