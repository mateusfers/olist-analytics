name: Update Data

on:
  schedule:
    - cron: '0 9 * * 0'  # Todo domingo às 9h
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install pandas numpy
    - name: Run data update
      run: |
        python -c "
import pandas as pd
print('📊 Atualizando dados...')
df = pd.read_csv('data/raw/olist_orders_dataset.csv')
print(f'✅ {len(df)} registros processados')
df.to_csv('data/processed_data.csv', index=False)
print('✅ Dados salvos em data/processed_data.csv')
"
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/processed_data.csv
        git diff --staged --quiet || git commit -m "chore: update processed data"
        git push